<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>UNKNOWN SIGNAL</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="terminal" aria-label="Signal interface">
    <pre class="screen" aria-hidden="true"><span id="output"></span><span class="cursor">_</span></pre>
    <button id="access" type="button" aria-label="Request signal access" hidden>□</button>
    <p id="alien-message" class="alien-text" hidden>CAN YOU HEAR ME</p>
    <p id="status" class="sr-only" role="status" aria-live="polite">Initializing interface.</p>
    <noscript><p>JavaScript is required to initialize this interface.</p></noscript>
  </main>
  <section id="viewer" class="viewer" aria-label="Image buffer" hidden>
    <div class="image-buffer">
      <button id="image-advance" class="image-advance" type="button" aria-label="Next image">
        <img id="scene" alt="" hidden>
        <span id="image-message">LOADING IMAGE...</span>
      </button>
      <p id="signal-message" class="alien-text signal-message" aria-label="저희 신호를 수신하셨다면 회신 부탁드립니다." hidden><span id="signal-text" aria-hidden="true"></span><span class="cursor" aria-hidden="true">_</span></p>
      <p id="buffer-status" role="status" aria-live="polite">IMAGE BUFFER : 01 / 03</p>
      <button id="next-image" class="viewer-control" type="button">NEXT</button>
    </div>
  </section>
</body>
</html>
